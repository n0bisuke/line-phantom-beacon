; line-phantom-beacon
; ボード一覧: pio boards <キーワード>   (例: pio boards esp32)

[platformio]
default_envs = m5stack-atoms3

[env:m5stack-atoms3]
; バージョンを固定しないと新しいプラットフォームが勝手に使われる(ESP32 は espressif32 8.0.0 = Arduino-ESP32 3.3.12)
platform = espressif32 @ ~8.0.0
board = m5stack-atoms3
framework = arduino
monitor_speed = 115200
; AtomS3 ボード定義には CDC_ON_BOOT がないため USB シリアル(=PCのminiterm)にログを出すにはこれが必要
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
; 書き込み・モニタは pio remote 経由(推奨)。
;   ホスト: pio remote agent start(初回に pio account login)
;   コンテナ: export PLATFORMIO_AUTH_TOKEN=$(sed -n 's/^PLATFORMIO_AUTH_TOKEN=//p' .env)
;             pio remote run -t upload / pio remote device monitor
; 代替(コンテナからRFC2217): ホストで esp_rfc2217_server -v -p 4000 /dev/ttyACM0
;   upload_port = rfc2217://host.docker.internal:4000?ign_set_control
;   monitor_port = rfc2217://host.docker.internal:4000?ign_set_control
lib_deps =
  ; Wi-Fi CSI 動作検知 (Arduino-ESP32 core 3.3+ / ESP32-S3 対応)
  francescopace/ESPectre@3.2.0
  ; AtomS3 LCD 表示 (M5GFX は依存で自動追加)
  m5stack/M5Unified@0.3.0

[env:native]
; ユニットテスト用(ボード不要)。テスト対象のロジックは lib/ 配下に置く(src/ はビルド対象外)。
platform = native
