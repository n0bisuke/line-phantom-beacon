; line-phantom-beacon
; ボード一覧: pio boards <キーワード>   (例: pio boards esp32)

[platformio]
default_envs = m5stack-atoms3

[env:m5stack-atoms3]
; バージョンを固定しないと新しいプラットフォームが勝手に使われる(ESP32 は espressif32 8.0.0 = Arduino-ESP32 3.3.12)
platform = espressif32 @ ~8.0.0
board = m5stack-atoms3
framework = arduino
monitor_speed = 115200
lib_deps =
  ; Wi-Fi CSI 動作検知 (Arduino-ESP32 core 3.3+ / ESP32-S3 対応)
  francescopace/ESPectre@3.2.0

[env:native]
; ユニットテスト用(ボード不要)。テスト対象のロジックは lib/ 配下に置く(src/ はビルド対象外)。
platform = native
test_filter = events
; ESP32 にコンテナから書き込む場合(ホストで esp_rfc2217_server を起動。README参照):
; upload_port = rfc2217://host.docker.internal:4000?ign_set_control
; monitor_port = rfc2217://host.docker.internal:4000?ign_set_control
