; line-phantom-beacon
; ボード一覧: pio boards <キーワード>   (例: pio boards esp32)
;
; 複数ボード対応: 共通設定を [env] に置き、ボードごとの env は上書きだけ書く。
; LCD の無いボードは PHANTOM_NO_DISPLAY=1 にする(src/display.cpp を参照)。
;
; | env                | ボード                     | LCD | フラッシュ | 備考 |
; |---                 |---                         |---  |---         |---   |
; | m5stack-atoms3     | M5Stack AtomS3             | あり| 8MB        | 既定・実機検証済み |
; | m5stack-atom       | ATOM Echo/Matrix/Lite      | なし| 4MB        | LED/ビープ・実機検証済み |
; | seeed_xiao_esp32c3 | XIAO ESP32-C3              | なし| 4MB        | 初回は merged 直書き必須(下記) |
; | seeed_xiao_esp32c6 | XIAO ESP32-C6              | なし| 4MB        | DNS トラフィック(WIFI_RAW不可) |
; | seeed_xiao_esp32s3 | XIAO ESP32-S3(+Plus/Sense) | なし| 8MB        | 検証中 |
;
; ⚠️ C3(XIAO ESP32-C3)と ATOM Echo などの 4MB ボードは、**チップに新しい
;   bootloader+パーティションを書き込む初回のみ、merged-firmware.bin のホスト直書きが必要**。
;   理由: `pio remote run -t upload` はアプリ領域(0x10000)のみ書き込むため、チップに
;   古いブートローダーが残っていると IROM≈1MB を超えるアプリのマッピングに失敗し、
;   ログ無しの起動ループ(rst:0x3)になる(2026-11-18 実機検証・C3 rev v0.3 で確認)。
;   手順は docs/handson-xiao-esp32c3.md / docs/handson-atom-echo.md を参照。

[platformio]
default_envs = m5stack-atoms3

[env]
; バージョンを固定しないと新しいプラットフォームが勝手に使われる(ESP32 は espressif32 8.0.0 = Arduino-ESP32 3.3.12)
platform = espressif32 @ ~8.0.0
framework = arduino
monitor_speed = 115200
; モニタ接続時の DTR/RTS でのリセットを無効化。
; AtomS3(USB-Serial-JTAG)はモニタ open ごとに rst:0x15 boot:0x20 DOWNLOAD モードに
; 落ちる罠があるため、モニタはタッチしない設定にする。
monitor_rts = 0
monitor_dtr = 0

[env:m5stack-atoms3]
board = m5stack-atoms3
; AtomS3 ボード定義には CDC_ON_BOOT がないため USB シリアル(=PCのminiterm)にログを出すにはこれが必要
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1
; 依存ライブラリ(native 環境を壊さないよう [env] 共通には置かない)
lib_deps =
  ; Wi-Fi CSI 動作検知 (Arduino-ESP32 core 3.3+)
  francescopace/ESPectre@3.2.0
  ; AtomS3 LCD 表示 (M5GFX は依存で自動追加)
  m5stack/M5Unified@0.3.0

; XIAO ESP32-C3: 2026-11-18 実機検証済み(Wi-Fi/CSI occ=1.0/動き検知/LINE push まで確認)。
; 初回書き込みのみ merged-firmware.bin 直書きが必要(docs/handson-xiao-esp32c3.md を参照)
[env:seeed_xiao_esp32c3]
board = seeed_xiao_esp32c3
board_build.partitions = huge_app.csv
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DPHANTOM_NO_DISPLAY=1
  ; オンボード LED(GPIO3/D6, 単色・アクティブLOW)。状態を点滅パターンで表示
  -DPHANTOM_GPIO_LED_PIN=3
  ; LINE push に付ける端末ラベル
  -DPHANTOM_DEVICE_ID=xiao-c3
lib_deps = francescopace/ESPectre@3.2.0

[env:seeed_xiao_esp32s3]
board = seeed_xiao_esp32s3
; XIAO ESP32-S3 / S3 Plus / S3 Sense 共通(LCD 無し)
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DPHANTOM_NO_DISPLAY=1
lib_deps =
  ; Wi-Fi CSI 動作検知 (Arduino-ESP32 core 3.3+)
  francescopace/ESPectre@3.2.0

[env:m5stack-atom]
; M5Stack ATOM Echo / Atom Lite / Atom Matrix 共通(LCD 無し・ESP32 クラシック PICO-D4 4MB)
board = m5stack-atom
; 4MB は既定パーティション(2スロットOTA)では CSI ファーム(約1.8MB)が入らないため
; huge_app(単一アプリ3MB + SPIFFS)にする
board_build.partitions = huge_app.csv
; LCD 無し: ヘッドレス(状態はシリアルログで確認)+ 圧電スピーカー(GPIO25)のビープ通知
; 注意: クラシックESP32ネイティブUSBは無いため ARDUINO_USB_CDC_ON_BOOT は付けない
;       (付けると HardwareSerial.h が USBSerial を参照してコンパイルエラーになる)
build_flags =
  -DPHANTOM_NO_DISPLAY=1
  -DPHANTOM_SPEAKER_PIN=25
  ; 内蔵 RGB LED (SK6812)。状態色で通知する
  -DPHANTOM_LED_PIN=27
  ; LINE push に付ける端末ラベル(secrets.h の DEVICE_ID を上書き。文字列化して渡す)
  -DPHANTOM_DEVICE_ID=atom-echo
lib_deps =
  ; Wi-Fi CSI 動作検知 (Arduino-ESP32 core 3.3+)
  francescopace/ESPectre@3.2.0

; XIAO ESP32-C6: 4MB(LCD無し)。初回書き込みは merged 直書き必須(4MB ボード共通・下記参照)。
; ⚠️ ESPectre 3.2.0 は ESP32-C6 で WIFI_RAW をライブラリ側で拒否するため DNS トラフィックを使う
[env:seeed_xiao_esp32c6]
board = seeed_xiao_esp32c6
board_build.partitions = huge_app.csv
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DPHANTOM_NO_DISPLAY=1
  ; オンボード LED(GPIO15, 単色・アクティブLOW)。状態を点滅パターンで表示
  -DPHANTOM_GPIO_LED_PIN=15
  ; C6 は WIFI_RAW 不可 → DNS クエリでトラフィック生成(ICMP 制限環境でも動く)
  -DPHANTOM_TRAFFIC_DNS
  ; LINE push に付ける端末ラベル
  -DPHANTOM_DEVICE_ID=xiao-c6
lib_deps = francescopace/ESPectre@3.2.0

[env:m5stack-sticks3]
; M5Stack StickS3(1.9" 320x170 LCD + スピーカー, ESP32-S3FN8 8MB)。
; ボード定義が espressif32 8.0.0 に無いため AtomS3 定義(同チップ/同フラッシュ)を流用。
; LCD/MIC/Speaker は M5Unified 0.3.0 が StickS3 を自動検出(board_M5StickS3)。
; 表示座標は width() 可変対応済み(src/display.cpp)。
board = m5stack-atoms3
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  ; LINE push に付ける端末ラベル
  -DPHANTOM_DEVICE_ID=sticks3
lib_deps =
  francescopace/ESPectre@3.2.0
  m5stack/M5Unified@0.3.0

[env:native]
; ユニットテスト用(ボード不要)。テスト対象のロジックは lib/ 配下に置く(src/ はビルド対象外)。
platform = native
; [env] 共通の framework = arduino を打ち消す(さもないと g++ ビルドが board 要求で落ちる)
framework =
